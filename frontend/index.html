<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        input { padding: 8px; width: 100%; box-sizing: border-box; }
        button { padding: 8px 15px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .section { margin-bottom: 30px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>JWT</h1>

    <div class="section">
        <h2>Регистрация</h2>
        <form id="registerForm">
            <div class="form-group">
                <input type="text" id="registerUsername" placeholder="Имя пользователя" required>
            </div>
            <div class="form-group">
                <input type="password" id="registerPassword" placeholder="Пароль" required>
            </div>
            <button type="submit">Зарегистрироваться</button>
        </form>
        <p id="registerMessage"></p>
    </div>

    <div class="section">
        <h2>Логин +пароль</h2>
        <form id="loginForm">
            <div class="form-group">
                <input type="text" id="loginUsername" placeholder="Имя пользователя" required>
            </div>
            <div class="form-group">
                <input type="password" id="loginPassword" placeholder="Пароль" required>
            </div>
            <button type="submit">Войти</button>
        </form>
        <p id="loginMessage"></p>
    </div>

    <div class="section">
        <h2>Защищенные данные</h2>
        <button id="fetchProtectedData">Извлечение защищенных данных</button>
        <pre id="protectedData"></pre>
    </div>

    <script src="app.js"></script>
</body>
</html>
